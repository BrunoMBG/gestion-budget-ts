<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mon budget</title>
  </head>
  <body>
    <div id="app">
      <!-- ---------------------- Header ---------------------- -->
      <header class="header">
        <h1 class="header__titre">Mon budget</h1>
      </header>
    </div>
    <!-- ---------------------- Main ---------------------- -->
    <main>
      <!-- ---------------------- Section solde ---------------------- -->
      <section class="resume" aria-label="Résumé du budget">
        <p class="resume__libelle">Solde total</p>
        <p class="resume__total" id="soldeTotal">1 363,60 €</p>
        <div class="resume__blocs">
          <!-- Revenus -->
          <article class="resume__bloc resume__bloc--revenu">
            <p class="resume__bloc-titre">Revenus</p>
            <p class="resume__bloc-montant" id="totalRevenus">+ 2 200,00 €</p>
          </article>
          <!-- Dépenses -->
          <article class="resume__bloc resume__bloc--depense">
            <p class="resume__bloc-titre">Dépenses</p>
            <p class="resume__bloc-montant" id="totalDepenses">- 836,40 €</p>
          </article>
        </div>
      </section>
      <!-- ---------------------- Filtres ---------------------- -->
      <section class="filtres" aria-label="Filtres des transactions">
        <!-- Filtre par type -->
        <div class="filtres__groupe" role="group" aria-label="Filtrer par type">
          <button
            type="button"
            id="filtreTypeTous"
            class="filtres__bouton filtres__bouton--actif"
            data-type="tous"
          >
            Tous
          </button>
          <button
            type="button"
            id="filtreTypeRevenus"
            class="filtres__bouton"
            data-type="revenu"
          >
            Revenus
          </button>
          <button
            type="button"
            id="filtreTypeDepenses"
            class="filtres__bouton"
            data-type="depense"
          >
            Dépenses
          </button>
        </div>

        <!-- Filtre par catégorie -->
        <div
          class="filtres__groupe"
          id="conteneurFiltresCategories"
          role="group"
          aria-label="Filtrer par catégorie"
        >
          <button
            type="button"
            id="filtreCatToutes"
            class="filtres__bouton filtres__bouton--actif"
            data-categorie="toutes"
          >
            Toutes catégories
          </button>
          <button
            type="button"
            id="filtreCatAlimentation"
            class="filtres__bouton"
            data-categorie="alimentation"
          >
            Alimentation
          </button>
          <button
            type="button"
            id="filtreCatLoyer"
            class="filtres__bouton"
            data-categorie="loyer"
          >
            Loyer
          </button>
          <button
            type="button"
            id="filtreCatLoisirs"
            class="filtres__bouton"
            data-categorie="loisirs"
          >
            Loisirs
          </button>
        </div>
      </section>

      <!-- ---------------------- Transactions ---------------------- -->
      <section class="transactions" aria-label="Liste des transactions">
        <div class="transactions__tri">
          <label for="triTransactions" class="transactions__label"
            >Trier par</label
          >
          <select id="triTransactions" class="transactions__select">
            <option value="dateDesc">Date (plus récent)</option>
            <option value="dateAsc">Date (plus ancien)</option>
            <option value="montantDesc">Montant (décroissant)</option>
            <option value="montantAsc">Montant (croissant)</option>
            <option value="titreAsc">Titre (A → Z)</option>
          </select>
        </div>

        <ul id="listeTransactions" class="transactions__liste">
          <li class="transaction transaction--revenu" data-id="1">
            <div class="transaction__infos">
              <h3 class="transaction__titre">Salaire de septembre</h3>
              <div class="transaction__details">
                <span class="transaction__badge">Loisirs</span>
                <time datetime="2026-09-03" class="transaction__date"
                  >3 sept. 2026</time
                >
              </div>
            </div>
            <div class="transaction__action">
              <span class="transaction__montant transaction__montant--revenu"
                >+ 2 200,00 €</span
              >
              <button
                type="button"
                class="transaction__bouton-supprimer"
                aria-label="Supprimer la transaction Salaire de septembre"
              >
                ✕
              </button>
            </div>
          </li>
        </ul>
      </section>

      <!-- ---------------------- Formulaire ---------------------- -->
      <form
        id="formTransaction"
        class="form-transaction"
        aria-label="Ajouter une transaction"
      >
        <h2 class="form-transaction__titre">Nouvelle transaction</h2>

        <!-- Titre -->
        <div class="form-transaction__champ">
          <label for="titre" class="form-transaction__label">Titre</label>
          <input
            type="text"
            id="titre"
            class="form-transaction__input"
            placeholder="Ex. Courses de la semaine"
            required
          />
        </div>

        <!-- Montant -->
        <div class="form-transaction__champ">
          <label for="montant" class="form-transaction__label"
            >Montant (€)</label
          >
          <input
            type="number"
            id="montant"
            class="form-transaction__input"
            placeholder="0,00"
            step="0.01"
            min="0.01"
            required
          />
        </div>

        <div class="form-transaction__bloc">
          <div class="form-transaction__champ">
            <label for="type" class="form-transaction__label">Type</label>
            <select id="type" class="form-transaction__select" required>
              <option value="revenu">Revenu</option>
              <option value="depense">Dépense</option>
            </select>
          </div>

          <div class="form-transaction__champ">
            <label for="categorie" class="form-transaction__label"
              >Catégorie</label
            >
            <select id="categorie" class="form-transaction__select" required>
              <option value="alimentation">Alimentation</option>
              <option value="loyer">Loyer</option>
              <option value="loisirs">Loisirs</option>
              <option value="autre">Autre</option>
            </select>
          </div>
        </div>

        <!-- Date -->
        <div class="form-transaction__champ">
          <label for="date" class="form-transaction__label">Date</label>
          <input
            type="date"
            id="date"
            class="form-transaction__input"
            required
          />
        </div>

        <!-- Bouton -->
        <button type="submit" class="form-transaction__bouton">
          Ajouter la transaction
        </button>
      </form>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
